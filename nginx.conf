upstream web {
    server web:3000;
}

upstream be {
    server be:3001;
}

upstream ws {
    server ws:3002;
}

server {
    listen 80;

    location /api/ {
        proxy_pass http://be;
        proxy_http_version 1.1;
    }

    location /socket.io/ {
        proxy_pass http://ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
    }
}