name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run all checks and build
        run: bunx turbo run lint check-types build

  deploy:
    needs: ci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.ref == 'refs/heads/main'

    # Shared with the scheduled Docker prune so the two can never touch the
    # EC2 box at the same time. Scoped to this job so PR CI is not queued
    # behind a running production deploy.
    concurrency:
      group: ec2-production
      cancel-in-progress: false

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 30s
          command_timeout: 30m
          script: |
            set -e
            cd ~/modheshwari

            cleanup_docker() {
              echo "Pruning dangling containers, images, volumes, networks..."
              docker container prune -f || true
              docker image prune -f || true
              docker volume prune -f || true
              docker network prune -f || true
            }

            cleanup_after_build() {
              echo "Pruning old build cache (keeping last 2GB)..."
              docker builder prune -f --keep-storage=2g || true
            }

            check_disk_space() {
              MIN_FREE_MB=8000
              AVAILABLE_MB=$(df -Pm . | awk 'NR==2 {print $4}')
              echo "Available disk space: ${AVAILABLE_MB}MB"
              if [ "$AVAILABLE_MB" -lt "$MIN_FREE_MB" ]; then
                echo "Not enough disk space to build safely. Need at least ${MIN_FREE_MB}MB free."
                exit 1
              fi
            }

            prepare_for_build() {
              cleanup_docker
              check_disk_space
            }

            # Build sequentially: building all three at once is what exhausted
            # the disk previously. Used by both the forward and rollback paths.
            build_images() {
              docker compose build be && docker compose build ws && docker compose build web
            }

            rollback_to() {
              TARGET="$1"
              echo "Rolling back to $TARGET"
              cleanup_docker
              git reset --hard "$TARGET"
              if ! build_images; then
                echo "Rollback build failed; leaving current containers running"
                exit 1
              fi
              docker compose --env-file .env up -d --remove-orphans
              exit 1
            }

            # Ensure we're on main branch (previous rollback may have left detached HEAD)
            git checkout main

            # Save current commit for rollback
            PREV_COMMIT=$(git rev-parse HEAD)
            echo "Previous commit: $PREV_COMMIT"

            export COMPOSE_HTTP_TIMEOUT=300
            export DOCKER_CLIENT_TIMEOUT=300

            # Reclaim disk and bail before touching the working tree, so a
            # low-disk abort leaves the box on the currently deployed commit.
            prepare_for_build

            # Discard local drift, then pull new code. Deliberately not `git
            # stash`: stashes were never popped and accumulated on the box.
            git reset --hard HEAD
            git pull origin main || { echo "git pull failed, rolling back"; git reset --hard "$PREV_COMMIT"; exit 1; }

            if ! build_images; then
              echo "Build failed"
              rollback_to "$PREV_COMMIT"
            fi

            # Deploy
            docker compose --env-file .env up -d --remove-orphans

            # Health check with retries
            echo "Waiting for services to start..."
            sleep 15
            HEALTHY=false
            for i in 1 2 3 4 5; do
              echo "Health check attempt $i/5..."
              if docker compose exec -T be bun -e "try { const r = await fetch('http://localhost:3001/api/health'); process.exit(r.ok ? 0 : 1) } catch { process.exit(1) }" 2>/dev/null; then
                HEALTHY=true
                break
              fi
              sleep 10
            done

            if [ "$HEALTHY" = false ]; then
              echo "Health check failed"
              rollback_to "$PREV_COMMIT"
            fi

            cleanup_after_build

            echo "Deploy successful"
