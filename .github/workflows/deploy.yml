name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run all checks and build
        run: bunx turbo run lint check-types build

  deploy:
    needs: ci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 30s
          command_timeout: 30m
          script: |
            set -e
            cd ~/modheshwari

            cleanup_docker() {
              echo "Pruning all unused Docker resources..."
              docker container prune -f || true
              docker image prune -af || true
              docker volume prune -f || true
              docker builder prune -af || true
              docker network prune -f || true
            }

            check_disk_space() {
              MIN_FREE_MB=15000
              AVAILABLE_MB=$(df -Pm . | awk 'NR==2 {print $4}')
              echo "Available disk space: ${AVAILABLE_MB}MB"
              if [ "$AVAILABLE_MB" -lt "$MIN_FREE_MB" ]; then
                echo "Not enough disk space to build safely. Need at least ${MIN_FREE_MB}MB free."
                exit 1
              fi
            }

            prepare_for_build() {
              cleanup_docker
              check_disk_space
            }

            # Ensure we're on main branch (previous rollback may have left detached HEAD)
            git checkout main

            # Save current commit for rollback
            PREV_COMMIT=$(git rev-parse HEAD)
            echo "Previous commit: $PREV_COMMIT"

            # Pull new code
            git stash
            git pull origin main || { echo "git pull failed, rolling back"; git reset --hard "$PREV_COMMIT"; exit 1; }

            export COMPOSE_HTTP_TIMEOUT=300
            export DOCKER_CLIENT_TIMEOUT=300

            prepare_for_build

            # Build images sequentially to avoid peak disk usage
            if ! docker compose build --no-parallel; then
              echo "Build failed, rolling back to $PREV_COMMIT"
              cleanup_docker
              git reset --hard "$PREV_COMMIT"
              docker compose --env-file .env up -d --remove-orphans
              exit 1
            fi

            # Deploy
            docker compose --env-file .env up -d --remove-orphans

            # Health check with retries
            echo "Waiting for services to start..."
            sleep 15
            HEALTHY=false
            for i in 1 2 3 4 5; do
              echo "Health check attempt $i/5..."
              if docker compose exec -T be bun -e "try { const r = await fetch('http://localhost:3001/api/health'); process.exit(r.ok ? 0 : 1) } catch { process.exit(1) }" 2>/dev/null; then
                HEALTHY=true
                break
              fi
              sleep 10
            done

            if [ "$HEALTHY" = false ]; then
              echo "Health check failed, rolling back to $PREV_COMMIT"
              cleanup_docker
              git reset --hard "$PREV_COMMIT"
              docker compose --env-file .env up -d --remove-orphans
              exit 1
            fi

            cleanup_docker

            echo "Deploy successful"
