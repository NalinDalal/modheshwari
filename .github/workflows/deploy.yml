name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run all checks and build
        run: bunx turbo run lint check-types build

  build-and-push:
    needs: ci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push be
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runner-be
          push: true
          tags: ghcr.io/nerdev-co/modheshwari-be:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runner-web
          push: true
          tags: ghcr.io/nerdev-co/modheshwari-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ws
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runner-ws
          push: true
          tags: ghcr.io/nerdev-co/modheshwari-ws:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.ref == 'refs/heads/main'

    concurrency:
      group: ec2-production
      cancel-in-progress: false

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 30s
          command_timeout: 30m
          script: |
            set -e
            cd ~/modheshwari

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export COMPOSE_HTTP_TIMEOUT=300
            export DOCKER_CLIENT_TIMEOUT=300

            # Tag current images as :previous for rollback
            for svc in be web ws; do
              IMAGE="ghcr.io/nerdev-co/modheshwari-${svc}:latest"
              docker image inspect "$IMAGE" >/dev/null 2>&1 && \
                docker tag "$IMAGE" "modheshwari-${svc}:previous" || \
                echo "No existing image for $svc, skipping backup"
            done

            # Pull new images
            docker compose pull be web ws

            # Deploy
            docker compose --env-file .env up -d --remove-orphans

            # Health check with retries
            echo "Waiting for services to start..."
            sleep 15
            HEALTHY=false
            for i in 1 2 3 4 5; do
              echo "Health check attempt $i/5..."
              if docker compose exec -T be bun -e "try { const r = await fetch('http://localhost:3001/api/health'); process.exit(r.ok ? 0 : 1) } catch { process.exit(1) }" 2>/dev/null; then
                HEALTHY=true
                break
              fi
              sleep 10
            done

            if [ "$HEALTHY" = false ]; then
              echo "Health check failed — rolling back to previous images"
              for svc in be web ws; do
                PREV="modheshwari-${svc}:latest"
                docker image inspect "modheshwari-${svc}:previous" >/dev/null 2>&1 && \
                  docker tag "modheshwari-${svc}:previous" "$PREV" || true
              done
              docker compose --env-file .env up -d --remove-orphans
              echo "Rolled back to previous version"
              exit 1
            fi

            # Cleanup
            docker image prune -f || true

            echo "Deploy successful"
